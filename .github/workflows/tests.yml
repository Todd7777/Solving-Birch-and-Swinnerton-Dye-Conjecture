name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (PARI via cypari2 wheels, Arb via python-flint)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the test suite (Sage-dependent tests are skipped when Sage is absent)
        run: python -m pytest -q
